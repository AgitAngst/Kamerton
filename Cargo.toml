[package]
name = "kamerton"
version = "1.4.0"
edition = "2024"
description = "Tray volume mixer for Windows"
license = "MIT"
publish = false

[[bin]]
name = "kamerton"
path = "src/main.rs"

[dependencies]
# Общий вид семьи Anvil: палитра, шрифты, элементы, движение.
anvil-ui = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.9.1" }
anvil-update = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.9.1" }
# Окно egui на Direct3D 11 без eframe — крейт набора (с 1.3.11; раньше своя копия: src/d3d.rs, src/shell.rs).
anvil-d3d = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.9.1" }
# eframe — только ради типов egui для набора anvil-ui; окно рисует крейт anvil-d3d (свой цикл и рисовальщик D3D11).
eframe = "0.36.2"
# Событие окна для медиа-клавиш (тот же winit, что у anvil-d3d).
winit = "0.30.13"

# Win32: Core Audio (COM), процессы, ресурсы версии файла, консоль, трей, окно, мониторы, значки.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Значок exe — ресурс из `assets/icon/kamerton.ico` (разрешено владельцем 24.10.2026).
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
