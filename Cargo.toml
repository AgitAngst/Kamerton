[package]
name = "kamerton"
version = "0.2.0"
edition = "2024"
description = "Tray volume mixer for Windows"
license = "MIT"
publish = false

[[bin]]
name = "kamerton"
path = "src/main.rs"

[dependencies]
# Общий вид семьи Anvil: палитра, шрифты, элементы, движение.
anvil-ui = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.6.1" }
# glow (OpenGL) вместо wgpu: окно-всплывашка, а wgpu держит сотни МБ; wgpu тянет набор, выбор — в main.rs.
eframe = { version = "0.36.2", features = ["glow"] }

# Win32: Core Audio (COM), процессы, ресурсы версии файла, консоль, трей, окно, мониторы, значки.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
