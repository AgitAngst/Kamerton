[package]
name = "kamerton"
version = "0.2.1"
edition = "2024"
description = "Tray volume mixer for Windows"
license = "MIT"
publish = false

[[bin]]
name = "kamerton"
path = "src/main.rs"

[dependencies]
# Общий вид семьи Anvil: палитра, шрифты, элементы, движение.
anvil-ui = { git = "https://github.com/AgitAngst/Anvil", tag = "kit-v0.6.1" }
# eframe — только ради типов egui для набора anvil-ui; окно рисует свой цикл (`shell.rs`) на D3D11.
eframe = "0.36.2"
# Окно и ввод для своего цикла; те же версии, что у eframe (разрешено владельцем 22.10.2026).
egui-winit = "0.36.2"
winit = "0.30.13"

# Win32: Core Audio (COM), процессы, ресурсы версии файла, консоль, трей, окно, мониторы, значки.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
