[package]
name = "kamerton"
version = "0.1.0"
edition = "2024"
description = "Tray volume mixer for Windows"
license = "MIT"
publish = false

[[bin]]
name = "kamerton"
path = "src/main.rs"

[dependencies]

# Win32: Core Audio (COM), процессы, ресурсы версии файла, консоль.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = 3
lto = true
